<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK - Live stream dashboard</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ec; --panel:#ffffff; --ink:#1d1b16; --muted:#6b675c; --line:#e6e1d3;
  --brand:#f5b400; --brand-deep:#d99a00; --brand-soft:#fff4d1;
  --green:#2e7d4f; --green-soft:#e4f3ea; --warn:#b4540a; --warn-soft:#fdeedd; --bad:#b3261e; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(29,27,22,.06),0 4px 14px rgba(29,27,22,.05);
}
*{box-sizing:border-box}
html{font-size:13px}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--ink);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--brand)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff;padding:1px;flex:none}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
.hsub{color:#bdb8aa;font-size:11px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;font-size:12px}
button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:500;transition:.15s}
button:hover{border-color:var(--brand-deep);background:var(--brand-soft)}
button.primary{background:var(--brand);border-color:var(--brand);color:#1d1b16;font-weight:600}
button.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
button.ghost{background:transparent;color:#fff;border-color:#4a463b}
button.ghost:hover{background:#2c2a22;border-color:var(--brand)}
button:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible{outline:2px solid var(--brand-deep);outline-offset:2px}
select,input[type=text],input[type=search],input[type=password],input[type=date]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;color:var(--ink)}
header select{background:#2c2a22;color:#fff;border-color:#4a463b}
.who{background:var(--brand);color:#1d1b16;border-radius:20px;padding:3px 10px;font-weight:600;font-size:11px}
main{padding:16px 18px;max-width:1600px;margin:0 auto}

.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.stat span{color:var(--muted);font-size:11px}
.stat.good b{color:var(--green)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input[type=search]{flex:1;min-width:160px;max-width:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border-radius:20px;padding:4px 11px;font-size:11px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on:hover{background:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:9px;padding:8px 10px;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(29,27,22,.12)}
.tile.none{border-left-color:var(--brand-deep);background:#fffdf6}
.tile.err{border-left-color:var(--bad);background:#fffafa}
.tt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding-right:14px}
.tt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.tile.none .dot{background:var(--brand-deep)}.tile.err .dot{background:var(--bad)}
.tn{font-size:22px;font-weight:700;line-height:1.15;margin-top:3px;color:var(--green)}
.tile.none .tn{color:var(--warn)}.tile.err .tn{color:var(--bad)}
.tl{font-size:10.5px;color:var(--muted)}
.rm{position:absolute;top:4px;right:4px;border:none;background:none;color:var(--bad);padding:0 5px;font-size:14px;line-height:1.2}
.rm:hover{background:var(--bad-soft)}
.rm.ed{right:24px;color:var(--muted);font-size:12px;top:5px}
.rm.ed:hover{background:var(--brand-soft)}

.stickyctl{position:sticky;top:var(--hh,60px);z-index:6;background:var(--bg);padding:2px 0 6px}
.back{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.back h2{font-size:15px;margin:0 6px 0 0}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;box-shadow:var(--shadow)}
.filters label{color:var(--muted);font-size:11px;display:flex;gap:5px;align-items:center}
.meta{color:var(--muted);font-size:11px}
.err-text{color:var(--bad);font-size:11px;margin-top:4px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:68vh;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fbf3d6;cursor:pointer;font-weight:600;user-select:none;font-size:11.5px}
th:hover{background:var(--brand-soft)}
tbody tr:nth-child(even){background:#fcfbf7}
tbody tr:hover{background:var(--brand-soft)}
.num{text-align:right}
.noRows{padding:28px;text-align:center;color:var(--muted)}
.more{margin:10px 0;text-align:center}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:20px;max-width:640px}
.empty ol{padding-left:18px;margin:8px 0}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;width:min(400px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(29,27,22,.5)}
dialog h2{margin:0 0 2px;font-size:15px}
dialog label{display:block;margin:10px 0 3px;font-weight:600;font-size:11.5px}
dialog input{width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlghead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.dlghead img{width:36px;height:36px;border-radius:50%}
@media(max-width:600px){main{padding:10px}header{padding:8px 10px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="Babai Tiffins">
    <div>
      <h1>CK - Live stream dashboard</h1>
      <div class="hsub" id="status">Loading...</div>
    </div>
  </div>
  <div class="tools">
    <select id="interval" aria-label="Auto refresh">
      <option value="0">Auto refresh: Off</option>
      <option value="60">Auto refresh: 1 min</option>
      <option value="300" selected>Auto refresh: 5 min</option>
      <option value="900">Auto refresh: 15 min</option>
    </select>
    <button class="ghost" id="refreshBtn">Refresh now</button>
    <button class="primary" id="addBtn" hidden>Add sheet</button>
    <span class="who" id="who" hidden></span>
    <button class="ghost" id="loginBtn">Login</button>
    <button class="ghost" id="logoutBtn" hidden>Logout</button>
  </div>
</header>
<main id="view"></main>

<dialog id="loginDlg">
  <div class="dlghead"><img src="logo.png" alt=""><h2>Admin login</h2></div>
  <label for="lu">Username</label>
  <input type="text" id="lu" autocomplete="username">
  <label for="lp">Password</label>
  <input type="password" id="lp" autocomplete="current-password">
  <div class="err-text" id="loginErr"></div>
  <div class="row"><button id="loginCancel">Cancel</button><button class="primary" id="loginGo">Login</button></div>
</dialog>

<dialog id="dlg">
  <h2>Add a Google Sheet</h2>
  <div class="meta">Use the link from File, Share, Publish to web, format CSV.</div>
  <label for="nm">Display name</label>
  <input type="text" id="nm" placeholder="e.g. Closing">
  <label for="ul">Published CSV link</label>
  <input type="text" id="ul" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
  <div class="err-text" id="dlgErr"></div>
  <div class="row"><button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save sheet</button></div>
</dialog>

<script>
/* ===== Sheets shown to everyone. Add all your sheets here (name + published CSV link). ===== */
const DEFAULT_SHEETS = [
  { name: "Closing", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTWTzABYNV_ISTxQcSpIfYfHxgJOm3bvKIEo0mmWmi1Qj_h5Cujf7_dclucFZmTgXP__kK9iCouAXkT/pub?gid=0&single=true&output=csv" }
];
/* ===== Admin login ===== */
const ADMIN_USER = "zakariya";
const ADMIN_PASS = "admin123";

const STORE = "ckLiveDashboard.v3";
const PAGE = 300;
let sheets = loadSheets();
let data = {};
let current = "overview";
let sortState = {}, filters = {}, dateF = {}, limit = {};
let search = "", ovSearch = "", ovFilter = "all";
let timer = null;
let isAdmin = sessionStorage.getItem("ckAdmin") === "1";

function loadSheets(){
  try{ const s = JSON.parse(localStorage.getItem(STORE) || "null"); if(Array.isArray(s) && s.length) return DEFAULT_SHEETS.concat(s.filter(x => !DEFAULT_SHEETS.some(d => d.name === x.name))); }catch(e){}
  return DEFAULT_SHEETS.slice();
}
function saveSheets(){
  try{ localStorage.setItem(STORE, JSON.stringify(sheets.filter(s => !DEFAULT_SHEETS.some(d => d.name === s.name)))); }catch(e){}
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- CSV + helpers ---------- */
function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const DATE_RE = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
function dateVal(s){
  const m = String(s).trim().match(DATE_RE);
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)).getTime() : null;
}
function numVal(s){
  const t = String(s).trim().replace(/,/g, "");
  return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : null;
}
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const DAY = 86400000;
function fmtTime(ms){ return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

function build(text){
  const all = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
  if(!all.length) return { cols: [], rows: [], types: [], dateCol: -1, filterCols: [] };
  const head = all[0].map((h, i) => h.trim() || ("Column " + (i + 1)));
  const body = all.slice(1);
  const keep = head.map((h, i) => !/^image/i.test(h) && body.some(r => (r[i] || "").trim() !== ""));
  const cols = head.filter((_, i) => keep[i]);
  const rows = body.map(r => head.map((_, i) => (r[i] || "").trim()).filter((_, i) => keep[i]));
  const types = cols.map((_, c) => {
    const vals = rows.map(r => r[c]).filter(v => v !== "");
    if(!vals.length) return "text";
    if(vals.every(v => numVal(v) !== null)) return "number";
    if(vals.filter(v => dateVal(v) !== null).length / vals.length > 0.8) return "date";
    return "text";
  });
  let dateCol = cols.findIndex((c, k) => types[k] === "date" && /timestamp/i.test(c));
  if(dateCol < 0) dateCol = types.indexOf("date");
  const filterCols = cols.map((c, k) => {
    if(types[k] !== "text" || /^id$/i.test(c)) return false;
    const set = new Set(rows.map(r => r[k]).filter(v => v !== ""));
    return set.size > 1 && set.size <= 30;
  });
  return { cols, rows, types, dateCol, filterCols };
}

/* ---------- Loading ---------- */
async function loadOne(s){
  const sep = s.url.includes("?") ? "&" : "?";
  const res = await fetch(s.url + sep + "_=" + Date.now(), { cache: "no-store" });
  if(!res.ok) throw new Error("Could not open the link (error " + res.status + "). Check that it is published as CSV.");
  const text = await res.text();
  if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("The link did not return CSV data. Publish the sheet to web with format CSV.");
  return build(text);
}
async function refreshAll(){
  document.getElementById("status").textContent = "Refreshing...";
  await Promise.all(sheets.map(async s => {
    try{ data[s.name] = Object.assign(await loadOne(s), { time: new Date(), error: null }); }
    catch(e){ data[s.name] = Object.assign({}, data[s.name], { error: (e && e.message && e.message !== "Failed to fetch") ? e.message : "Could not load. Check your internet and the published link." }); }
  }));
  document.getElementById("status").textContent = sheets.length ? "Live · refreshed " + new Date().toLocaleTimeString() : "No sheets added yet";
  render();
}
function setTimer(){
  clearInterval(timer);
  const sec = +document.getElementById("interval").value;
  if(sec) timer = setInterval(refreshAll, sec * 1000);
}

/* ---------- Today stats (overview) ---------- */
function todayInfo(d){
  if(!d || !d.rows || d.dateCol < 0) return { n: 0, last: null };
  const t0 = startOfDay(new Date()); let n = 0, last = 0;
  d.rows.forEach(r => { const v = dateVal(r[d.dateCol]); if(v !== null && v >= t0 && v < t0 + DAY){ n++; if(v > last) last = v; } });
  return { n, last: last || null };
}
function tileState(name){
  const d = data[name];
  if(!d) return "load";
  if(d.error && !d.rows) return "err";
  if(d.dateCol >= 0) return todayInfo(d).n ? "ok" : "none";
  return "ok";
}

/* ---------- Date filter ---------- */
function getDF(name, d){
  if(!dateF[name]) dateF[name] = { col: d.dateCol, preset: d.dateCol >= 0 ? "today" : "all", from: "", to: "" };
  return dateF[name];
}
function rangeOf(f){
  const t0 = startOfDay(new Date());
  if(f.preset === "today") return [t0, t0 + DAY - 1];
  if(f.preset === "yesterday") return [t0 - DAY, t0 - 1];
  if(f.preset === "7d") return [t0 - 6 * DAY, t0 + DAY - 1];
  if(f.preset === "month"){ const n = new Date(); return [new Date(n.getFullYear(), n.getMonth(), 1).getTime(), t0 + DAY - 1]; }
  if(f.preset === "custom"){
    const p = s => { const m = s && s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null; };
    const a = p(f.from), b = p(f.to);
    return [a, b === null ? null : b + DAY - 1];
  }
  return [null, null];
}

/* ---------- Rendering ---------- */
function render(){
  document.getElementById("addBtn").hidden = !isAdmin;
  document.getElementById("loginBtn").hidden = isAdmin;
  document.getElementById("logoutBtn").hidden = !isAdmin;
  const who = document.getElementById("who"); who.hidden = !isAdmin; who.textContent = "Admin: " + ADMIN_USER;
  const view = document.getElementById("view");
  if(!sheets.length){ view.innerHTML = emptyState(); return; }
  if(current !== "overview" && !sheets.find(s => s.name === current)) current = "overview";
  view.innerHTML = current === "overview" ? overview() : sheetView(current);
  bind();
  fit();
}

function fit(){
  const hd = document.querySelector('header');
  document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');
  const w = document.querySelector('.tablewrap');
  if(w){ const top = w.getBoundingClientRect().top; w.style.maxHeight = Math.max(240, window.innerHeight - top - 24) + 'px'; }
}
window.addEventListener('resize', fit);

function emptyState(){
  return '<div class="empty"><h2 style="margin-top:0">No sheets yet</h2><ol>' +
    '<li>Open the Google Sheet, click File, Share, then Publish to web.</li>' +
    '<li>Choose the tab and format CSV, then Publish.</li>' +
    '<li>Login as admin and paste the link with Add sheet.</li></ol></div>';
}

function overview(){
  const states = sheets.map(s => tileState(s.name));
  const nOk = states.filter(x => x === "ok").length, nNone = states.filter(x => x === "none").length, nErr = states.filter(x => x === "err").length;
  let list = sheets.map((s, i) => ({ s, st: states[i] }));
  if(ovFilter === "ok") list = list.filter(x => x.st === "ok");
  if(ovFilter === "none") list = list.filter(x => x.st === "none");
  if(ovFilter === "err") list = list.filter(x => x.st === "err");
  if(ovSearch) list = list.filter(x => x.s.name.toLowerCase().includes(ovSearch.toLowerCase()));
  const chip = (k, label) => '<button class="chip ' + (ovFilter === k ? "on" : "") + '" data-ovf="' + k + '">' + label + '</button>';
  let h = '<div class="summary">' +
    '<div class="stat"><b>' + sheets.length + '</b><span>Sheets connected</span></div>' +
    '<div class="stat good"><b>' + nOk + '</b><span>Entered today</span></div>' +
    '<div class="stat warn"><b>' + nNone + '</b><span>No entry today</span></div>' +
    '<div class="stat bad"><b>' + nErr + '</b><span>Errors</span></div></div>' +
    '<div class="bar"><input type="search" id="ovq" placeholder="Find a sheet" value="' + esc(ovSearch) + '" aria-label="Find a sheet">' +
    '<div class="chips">' + chip("all", "All") + chip("ok", "Entered today") + chip("none", "No entry today") + chip("err", "Errors") + '</div></div>' +
    '<div class="grid">';
  list.forEach(x => {
    const d = data[x.s.name] || {}; const ti = todayInfo(d);
    let big, lab;
    if(x.st === "err"){ big = "!"; lab = "Could not load"; }
    else if(x.st === "load"){ big = "..."; lab = "Loading"; }
    else if(d.dateCol < 0){ big = d.rows ? d.rows.length.toLocaleString() : "-"; lab = "rows (no date column)"; }
    else if(ti.n){ big = ti.n.toLocaleString(); lab = "entries today · latest " + fmtTime(ti.last); }
    else { big = "0"; lab = "No entry today"; }
    h += '<div class="tile ' + (x.st === "load" ? "" : x.st) + '" tabindex="0" role="button" data-open="' + esc(x.s.name) + '" title="' + esc(x.s.name) + '">' +
      (isAdmin ? '<button class="rm ed" data-rename="' + esc(x.s.name) + '" title="Rename sheet" aria-label="Rename ' + esc(x.s.name) + '">&#9998;</button>' : "") +
      (isAdmin ? '<button class="rm" data-remove="' + esc(x.s.name) + '" title="Remove sheet" aria-label="Remove ' + esc(x.s.name) + '">&times;</button>' : "") +
      '<div class="tt"><span class="dot"></span><span class="nm">' + esc(x.s.name) + '</span></div>' +
      '<div class="tn">' + big + '</div><div class="tl">' + lab + '</div></div>';
  });
  if(!list.length) h += '<div class="meta">No sheets match.</div>';
  return h + '</div>';
}

function sheetView(name){
  const d = data[name];
  const jump = '<select id="jump" aria-label="Go to sheet">' + '<option value="overview">All sheets</option>' +
    sheets.map(s => '<option value="' + esc(s.name) + '"' + (s.name === name ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") + '</select>';
  const top = '<div class="back"><button id="backBtn">&larr; All sheets</button><h2>' + esc(name) + '</h2>' + jump + '</div>';
  if(!d) return top + '<div class="meta">Loading...</div>';
  if(!d.rows) return top + '<div class="empty"><div class="err-text">' + esc(d.error) + '</div></div>';

  const df = getDF(name, d);
  const f = filters[name] = filters[name] || {};
  let rows = d.rows.slice();
  if(df.preset !== "all" && df.col >= 0){
    const [a, b] = rangeOf(df);
    rows = rows.filter(r => { const v = dateVal(r[df.col]); return v !== null && (a === null || v >= a) && (b === null || v <= b); });
  }
  Object.keys(f).forEach(c => { if(f[c]) rows = rows.filter(r => r[c] === f[c]); });
  if(search){ const q = search.toLowerCase(); rows = rows.filter(r => r.some(c => c.toLowerCase().includes(q))); }
  let st = sortState[name];
  if(!st && d.dateCol >= 0) st = sortState[name] = { col: d.dateCol, dir: -1 };
  if(st){
    const ty = d.types[st.col];
    const key = v => ty === "date" ? (dateVal(v) || 0) : ty === "number" ? (numVal(v) || 0) : v.toLowerCase();
    rows.sort((a, b) => { const A = key(a[st.col]), B = key(b[st.col]); return (A > B ? 1 : A < B ? -1 : 0) * st.dir; });
  }
  const shown = rows.slice(0, limit[name] || PAGE);

  const dateCols = d.cols.map((c, k) => d.types[k] === "date" ? k : -1).filter(k => k >= 0);
  const pre = (k, l) => '<button class="chip ' + (df.preset === k ? "on" : "") + '" data-preset="' + k + '">' + l + '</button>';
  const dateBox = dateCols.length ?
    '<label>Date by <select id="dcol">' + dateCols.map(k => '<option value="' + k + '"' + (df.col === k ? " selected" : "") + '>' + esc(d.cols[k]) + '</option>').join("") + '</select></label>' +
    '<span class="chips">' + pre("today", "Today") + pre("yesterday", "Yesterday") + pre("7d", "Last 7 days") + pre("month", "This month") + pre("all", "All") + '</span>' +
    '<label>From <input type="date" id="dfrom" value="' + esc(df.from) + '"></label><label>To <input type="date" id="dto" value="' + esc(df.to) + '"></label>' : "";
  const selects = d.cols.map((c, k) => {
    if(!d.filterCols[k]) return "";
    const vals = Array.from(new Set(d.rows.map(r => r[k]).filter(v => v !== ""))).sort((a, b) => a.localeCompare(b));
    return '<select data-filter="' + k + '" aria-label="Filter by ' + esc(c) + '"><option value="">All ' + esc(c) + '</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (f[k] === v ? " selected" : "") + '>' + esc(v) + '</option>').join("") + '</select>';
  }).join("");

  const head = d.cols.map((c, k) => '<th class="' + (d.types[k] === "number" ? "num" : "") + '" data-sort="' + k + '">' + esc(c) + (st && st.col === k ? (st.dir === 1 ? " ▲" : " ▼") : "") + '</th>').join("");
  const body = shown.map(r => "<tr>" + r.map((c, k) => '<td class="' + (d.types[k] === "number" ? "num" : "") + '">' + esc(c) + "</td>").join("") + "</tr>").join("");
  return '<div class="stickyctl">' + top +
    '<div class="filters">' + dateBox + '<input type="search" id="q" placeholder="Search in ' + esc(name) + '" value="' + esc(search) + '" aria-label="Search rows">' + selects +
    '<span class="meta">' + rows.length.toLocaleString() + ' of ' + d.rows.length.toLocaleString() + ' rows · updated ' + (d.time ? d.time.toLocaleTimeString() : "") + '</span></div></div>' +
    (d.error ? '<div class="err-text" style="margin-bottom:8px">Last refresh failed: ' + esc(d.error) + ' Showing earlier data.</div>' : "") +
    '<div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>' +
    (rows.length ? "" : '<div class="noRows">No rows for the selected dates. Click All to see every row.</div>') + '</div>' +
    (rows.length > shown.length ? '<div class="more"><button id="moreBtn">Show more rows (' + (rows.length - shown.length).toLocaleString() + ' left)</button></div>' : "");
}

function bind(){
  document.querySelectorAll("[data-open]").forEach(c => {
    const go = () => { current = c.dataset.open; search = ""; render(); window.scrollTo(0, 0); };
    c.onclick = go; c.onkeydown = e => { if(e.key === "Enter") go(); };
  });
  document.querySelectorAll("[data-remove]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if(!isAdmin) return;
    const n = b.dataset.remove;
    if(DEFAULT_SHEETS.some(x => x.name === n)){ alert("This sheet is set in the file list (DEFAULT_SHEETS). Remove it from the file to delete it for everyone."); return; }
    if(confirm("Remove " + n + " from the dashboard? The Google Sheet itself is not changed.")){ sheets = sheets.filter(s => s.name !== n); delete data[n]; saveSheets(); render(); }
  });
  document.querySelectorAll("[data-rename]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if(!isAdmin) return;
    const old = b.dataset.rename;
    if(DEFAULT_SHEETS.some(x => x.name === old)){ alert("This sheet is set in the file list (DEFAULT_SHEETS). Change its name in the file to rename it for everyone."); return; }
    const nn = (prompt("New name for this sheet", old) || "").trim();
    if(!nn || nn === old) return;
    if(sheets.some(s => s.name.toLowerCase() === nn.toLowerCase())){ alert("That name is already used. Choose another."); return; }
    sheets.find(s => s.name === old).name = nn;
    [data, sortState, filters, dateF, limit].forEach(o => { if(old in o){ o[nn] = o[old]; delete o[old]; } });
    if(current === old) current = nn;
    saveSheets(); render();
  });
  document.querySelectorAll("[data-ovf]").forEach(b => b.onclick = () => { ovFilter = b.dataset.ovf; render(); });
  const oq = document.getElementById("ovq");
  if(oq) oq.oninput = () => { ovSearch = oq.value; const p = oq.selectionStart; render(); const n = document.getElementById("ovq"); n.focus(); n.setSelectionRange(p, p); };
  const back = document.getElementById("backBtn"); if(back) back.onclick = () => { current = "overview"; render(); };
  const jump = document.getElementById("jump"); if(jump) jump.onchange = () => { current = jump.value; search = ""; render(); };

  document.querySelectorAll("[data-sort]").forEach(h => h.onclick = () => {
    const col = +h.dataset.sort, cur = sortState[current];
    sortState[current] = { col, dir: cur && cur.col === col ? -cur.dir : 1 }; render();
  });
  document.querySelectorAll("[data-filter]").forEach(s => s.onchange = () => {
    filters[current] = filters[current] || {}; filters[current][s.dataset.filter] = s.value; limit[current] = PAGE; render();
  });
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { dateF[current].preset = b.dataset.preset; dateF[current].from = ""; dateF[current].to = ""; limit[current] = PAGE; render(); });
  const dcol = document.getElementById("dcol"); if(dcol) dcol.onchange = () => { dateF[current].col = +dcol.value; render(); };
  const dfrom = document.getElementById("dfrom"), dto = document.getElementById("dto");
  const custom = () => { dateF[current].preset = "custom"; dateF[current].from = dfrom.value; dateF[current].to = dto.value; limit[current] = PAGE; render(); };
  if(dfrom) dfrom.onchange = custom; if(dto) dto.onchange = custom;
  const more = document.getElementById("moreBtn"); if(more) more.onclick = () => { limit[current] = (limit[current] || PAGE) + PAGE; render(); };
  const q = document.getElementById("q");
  if(q) q.oninput = () => { search = q.value; const pos = q.selectionStart; render(); const nq = document.getElementById("q"); nq.focus(); nq.setSelectionRange(pos, pos); };
}

/* ---------- Login / Logout ---------- */
const loginDlg = document.getElementById("loginDlg");
document.getElementById("loginBtn").onclick = () => { document.getElementById("loginErr").textContent = ""; document.getElementById("lp").value = ""; loginDlg.showModal(); document.getElementById("lu").focus(); };
document.getElementById("loginCancel").onclick = () => loginDlg.close();
function doLogin(){
  const u = document.getElementById("lu").value.trim().toLowerCase(), p = document.getElementById("lp").value;
  if(u === ADMIN_USER && p === ADMIN_PASS){ isAdmin = true; sessionStorage.setItem("ckAdmin", "1"); loginDlg.close(); document.getElementById("lu").value = ""; render(); }
  else document.getElementById("loginErr").textContent = "Wrong username or password.";
}
document.getElementById("loginGo").onclick = doLogin;
["lu", "lp"].forEach(id => document.getElementById(id).onkeydown = e => { if(e.key === "Enter") doLogin(); });
document.getElementById("logoutBtn").onclick = () => { isAdmin = false; sessionStorage.removeItem("ckAdmin"); render(); };

/* ---------- Add sheet (admin only) ---------- */
const dlg = document.getElementById("dlg");
document.getElementById("addBtn").onclick = () => { if(!isAdmin) return; document.getElementById("dlgErr").textContent = ""; dlg.showModal(); };
document.getElementById("cancelBtn").onclick = () => dlg.close();
document.getElementById("saveBtn").onclick = () => {
  if(!isAdmin) return;
  const name = document.getElementById("nm").value.trim();
  const url = document.getElementById("ul").value.trim();
  const err = document.getElementById("dlgErr");
  if(!name){ err.textContent = "Enter a display name."; return; }
  if(!/^https:\/\/docs\.google\.com\/spreadsheets\/.+/.test(url) || !/output=csv/.test(url)){ err.textContent = "Paste the published CSV link. It should end with output=csv."; return; }
  if(sheets.some(s => s.name.toLowerCase() === name.toLowerCase())){ err.textContent = "That name is already used. Choose another."; return; }
  sheets.push({ name, url }); saveSheets();
  document.getElementById("nm").value = ""; document.getElementById("ul").value = "";
  dlg.close(); refreshAll();
};
document.getElementById("refreshBtn").onclick = refreshAll;
document.getElementById("interval").onchange = setTimer;

setTimer(); render(); refreshAll();
</script>
</body>
